const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];function toast(x){let t=q('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}function openM(x){q('#modal').innerHTML=x;q('#mbg').classList.add('show')}function closeM(){q('#mbg').classList.remove('show');q('#modal').classList.remove('bottomSheetWrap')}q('#mbg').onclick=e=>{if(e.target.id==='mbg')closeM()};function icon(x){let m={'Dashboard':'⌂','Program':'▣','Program Saya':'▣','Program Builder':'✦','Curriculum':'≡','Communication':'✉','Journey Saya':'◎','Journey':'◎','Jadwal':'□','Kalender':'□','Pertemuan':'◫','Digital Buku Katekumen':'▤','Materi':'≡','Materi Saya':'≡','Attendance':'✓','Attendance Validation':'✓','Recovery':'↺','Recovery Review':'↺','Pembelajaran Susulan':'↺','Review Pembelajaran Susulan':'↺','Dokumen':'▧','Pengumuman':'◌','Profil':'○','Peserta':'◉','Peserta Saya':'◉','Kelas':'▦','Kelas Saya':'▦','Registrasi':'＋','Pendaftaran':'＋','Anak Saya':'◉','Progress':'◔','Follow-up':'!','Readiness':'◇','Readiness Administratif':'◇','Verifikasi Administratif':'◇','Handover Arsip':'⇄','Ready for Review':'◇','Approval':'✓','Completion':'◆','Reports':'⌁','Secretariat Staging':'⇄','Master Data':'◇','Users':'◉','Roles':'⌘','Assignments':'↔','Permissions':'⌾','Integration':'⇄','Settings':'⚙','Audit':'☷','System Health':'◌','Read-only Participants':'◉','Read-only Programs':'▣'};return m[x]||'•'}function av(r){return {'Peserta':'AW','Katekis':'RG','Koordinator':'KP','Sekretariat':'SK','Romo / Approver':'RP','Admin Katekese':'AD','Super Admin':'SA','Orang Tua/Wali':'WL','Auditor':'AU'}[r]||'AK'}function nm(r){return {'Peserta':'Antoni Wijaya','Katekis':'Riawan Gani','Koordinator':'Koordinator Program','Sekretariat':'Sekretariat Katekese','Romo / Approver':'Romo Pendamping','Admin Katekese':'Admin Katekese','Super Admin':'System Administrator','Orang Tua/Wali':'Orang Tua / Wali','Auditor':'Auditor'}[r]||r}function scope(r){return {'Peserta':'Katekumen Paskah 2027 · OMK','Katekis':'Program & kelas yang ditugaskan','Koordinator':'Program scope','Sekretariat':'Registration · Document · Staging','Romo / Approver':'Review & approval scope','Admin Katekese':'Lintas program','Super Admin':'System scope','Orang Tua/Wali':'Peserta anak terkait','Auditor':'Read-only scope'}[r]||''}
function pc(st,title,cat,desc,c){let open=st==='Pendaftaran Dibuka';return `<div class="card program"><span class="badge ${c}">${st}</span><div><h3>${title}</h3><p>${cat}</p></div><p>${desc}</p><div class="bottom"><button class="btn" onclick="detail('${title}')">Detail</button>${open?`<button class="btn primary" onclick="reg('${title}')">Daftar</button>`:`<button class="btn" disabled style="opacity:.55;cursor:not-allowed">Belum Dibuka</button>`}</div></div>`}function publicPage(){return `<div class="public"><div class="pubnav"><div class="brand"><div class="logo">AK</div><span>ADM Katekese</span></div><div class="links"><span>Beranda</span><span>Program</span><span>Jadwal</span><span>FAQ</span><span>Kontak</span></div><div class="actions"><button class="btn" onclick="login()">Login</button><button class="btn primary" onclick="reg('Katekumen Baptis Paskah 2027')">Daftar Program</button></div></div><section class="hero"><div><div class="eyebrow">Paroki St. Ambrosius · Pelayanan Katekese</div><h1>Menemani perjalanan iman dengan lebih terarah.</h1><p>Program, jadwal, materi, kehadiran, pembelajaran susulan, readiness, dan perjalanan katekese dalam satu pengalaman yang sederhana untuk peserta, wali, katekis, admin, dan pelayan pastoral.</p><div class="actions" style="margin-top:24px"><button class="btn primary" onclick="reg('Katekumen Baptis Paskah 2027')">Lihat Program Terbuka</button><button class="btn" onclick="login()">Login</button></div></div><div class="heroCard"><span class="badge blue">Peran pengguna</span><div class="quote">Peserta · Wali · Katekis · Koordinator · Sekretariat · Romo · Admin</div><div class="meta">Pilih user role saat login. Menu dan fitur akan menyesuaikan workflow dan scope masing-masing.</div><hr style="border:none;border-top:1px solid var(--b);margin:18px 0"><div class="list">${row('✓','Program journey','Frontpage → Login → Portal sesuai role','ok')}${row('✓','Digital Buku Katekumen','Catatan, materi, validasi kehadiran','ok')}${row('✓','Secretariat staging','Sinkronisasi bertahap melalui API','ok')}</div></div></section><section class="section"><div class="head"><div><div class="eyebrow">Program</div><h2>Pilih perjalanan katekese</h2></div><span class="muted">Program dipublikasikan oleh Admin Katekese</span></div><div class="programs">${pc('Pendaftaran Dibuka','Katekumen Baptis Paskah 2027','OMK · Dewasa','Pembinaan bertahap, kelas mingguan, retret, tahapan penerimaan, persiapan Baptis dan Mistagogi.','blue')}${pc('Akan Datang','Komuni Pertama 2027','Anak · Wali','Pembinaan dengan eligibility umur dan riwayat sakramen yang dapat dikonfigurasi.','warn')}${pc('Akan Datang','Krisma 2027','Remaja · OMK','Pembinaan, kehadiran, retret, readiness dan final review dalam satu journey.','ok')}</div></section></div>`}
function reg(program='Katekumen Baptis Paskah 2027'){S.selectedProgram=program;openM(`<span class="badge blue">${program}</span><h3 style="margin-top:12px">Daftar Program</h3><p class="muted">Pendaftaran program dilakukan dari Workspace Peserta. Pilih cara masuk di bawah.</p><div class="screen-grid" style="grid-template-columns:1fr 1fr;margin-top:16px"><button class="card screen-card clickCard" style="text-align:left" onclick="newParticipant('${program}')"><span class="badge ok">Peserta Baru</span><h4 style="margin-top:10px">Daftar Peserta</h4><p>Buat akun peserta baru, lengkapi profil, lalu isi formulir pendaftaran program.</p><div class="navPrompt">Buat akun & lanjutkan →</div></button><button class="card screen-card clickCard" style="text-align:left" onclick="participantLogin('${program}')"><span class="badge blue">Sudah Punya Akun</span><h4 style="margin-top:10px">Login Peserta</h4><p>Masuk menggunakan akun peserta dan lanjut ke formulir pendaftaran program.</p><div class="navPrompt">Login & lanjutkan →</div></button></div><div class="alert info" style="margin-top:16px">Program dibuat dan dipublikasikan oleh Admin Katekese. Peserta hanya dapat mendaftar pada program yang status pendaftarannya sedang dibuka.</div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeM()">Tutup</button></div>`)}function newParticipant(program){S.selectedProgram=program;openM(`<h3>Daftar Peserta Baru</h3><p class="muted">Langkah 1 dari 2 · Buat akun peserta sebelum mengisi formulir program.</p><div class="form2"><div class="field"><label>Nama lengkap</label><input id="newName" value="Antoni Wijaya"></div><div class="field"><label>Email</label><input value="antoni@example.org"></div><div class="field"><label>No. HP</label><input value="08xx xxxx xxxx"></div><div class="field"><label>Password</label><input type="password" value="password"></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class=" 'ekaristi':{title:'Sakramen Ekaristi',type:'Handout',when:'Post-class',author:'Katekis Maria',date:'16 Mei 2027',summary:'Ringkasan pembelajaran mengenai Ekaristi, Liturgi Sabda, Liturgi Ekaristi, dan partisipasi umat.',blocks:[['Inti Pembelajaran','Ekaristi dipahami sebagai perayaan syukur, perjamuan, dan kenangan akan karya keselamatan Kristus.'],['Pendalaman','Peserta diminta membaca kembali struktur Perayaan Ekaristi dan menuliskan hal yang paling menyentuh.']],files:[['Handout_Ekaristi.pdf','1.1 MB · 8 halaman']]},
'sakramen7':{title:'Tujuh Sakramen',type:'Video + Ringkasan',when:'Pre-class',author:'Tim Katekese',date:'9 Mei 2027',summary:'Pengantar tujuh sakramen dalam Gereja Katolik dan pengelompokannya.',blocks:[['Sakramen Inisiasi','Baptis, Ekaristi, Krisma.'],['Sakramen Penyembuhan','Tobat dan Pengurapan Orang Sakit.'],['Sakramen Pelayanan','Tahbisan dan Perkawinan.']],files:[['Video Pengantar','12 menit'],['Ringkasan_7_Sakramen.pdf','780 KB']]},
'keselamatan':{title:'Karya Keselamatan',type:'Make-up Material',when:'Recovery',author:'Katekis Riawan',date:'2 Mei 2027',summary:'Materi recovery untuk pertemuan yang tidak dihadiri.',blocks:[['Yang harus dipelajari','Baca ringkasan materi, tonton video, lalu isi refleksi singkat.'],['Status','Belum selesai. Setelah dikirim, Katekis akan melakukan verification.']],files:[['Recovery_Karya_Keselamatan.pdf','1.3 MB']]},

};let d=data[id]||data.baptis;let reflection=id==='refleksi-baptis'?`<div class="field"><label>Refleksi Saya</label><textarea rows="5" placeholder="Tuliskan refleksi Anda..."></textarea></div><div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" onclick="closeM();toast('Refleksi disimpan')">Simpan Refleksi</button></div>`:'';openM(`<div class="materialPreview"><span class="badge blue">${d.type}</span><h3 style="font-size:24px;margin:10px 0 4px">${d.title}</h3><div class="materialMeta"><span>${d.when}</span><span>${d.author}</span><span>${d.date}</span></div><p>${d.summary}</p>${d.blocks.map(b=>`<div class="contentBlock"><h4>${b[0]}</h4><p>${b[1]}</p></div>`).join('')}${d.files.length?`<div class="contentBlock"><h4>Lampiran dari Katekis</h4>${d.files.map(f=>`<div class="attachment"><div><b>${f[0]}</b><div class="muted" style="font-size:11px">${f[1]}</div></div><button class="btn" onclick="toast('Preview lampiran dibuka')">Preview</button></div>`).join('')}</div>`:''}${reflection}<div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeM()">Tutup</button></div></div>`)}
function handleUiClick(e){let btn=e.target.closest('.bottomAction');if(btn){e.preventDefault();let p=btn.dataset.page;if(btn.dataset.action==='menu'){openBottomMenu();return}if(p){nav(p);return}}let mi=e.target.closest('.menuPage');if(mi){e.preventDefault();if(mi.dataset.page)nav(mi.dataset.page);return}let lo=e.target.closest('.menuLogout');if(lo){e.preventDefault();logout();return}let mat=e.target.closest('[data-material]');if(mat){e.preventDefault();materialDetail(mat.dataset.material);return}}

function dashboard(){let body;if(S.role==='Peserta')body=partDash();else if(S.role==='Orang Tua/Wali')body=guardianDash();else if(S.role==='Katekis')body=katDash();else if(S.role==='Sekretariat')body=secretDash();else if(S.role==='Romo / Approver')body=approverDash();else if(S.role==='Super Admin')body=sysDash();else if(S.role==='Auditor')body=auditDash();else body=adminDash();return `<div class="dashSwipeEnabled"><div class="swipeHint">Geser kartu ringkasan ke kiri/kanan untuk melihat indikator lainnya.</div>${body}</div>`}

ilestoneMini"><b>Verification</b><span>✓ Selesai</span></div><div class="milestoneMini"><b>Penerimaan Katekumen</b><span>✓ Selesai</span></div><div class="milestoneMini"><b>Formation</b><span>● Saat ini</span></div><div class="milestoneMini"><b>Retret</b><span>○ Berikutnya</span></div><div class="milestoneMini"><b>Pemilihan</b><span>○ Belum</span></div><div class="milestoneMini"><b>Baptis</b><span>○ Belum</span></div><div class="milestoneMini"><b>Mistagogi</b><span>○ Belum</span></div></div></div><div class="journeyProgram future"><div class="programHead"><div><span class="status warn">Program berikutnya</span><h3 style="margin:7px 0 3px">Program lanjutan sesuai eligibility</h3><p class="muted">Sistem menampilkan program berikutnya berdasarkan usia, riwayat sakramen dan aturan program.</p></div></div></div></div><div class="alert info" style="margin-top:14px"><b>Contoh lintas program:</b> peserta yang telah menyelesaikan Komuni Pertama kemudian mengikuti Krisma akan melihat keduanya tersambung pada timeline yang sama, tanpa membuat profil baru.</div></div>`}
